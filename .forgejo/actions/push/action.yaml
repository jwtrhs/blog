name: Push
description: Push a container image

inputs:
  registry:
    description: Registry
    required: true
  repository:
    description: Repository
    required: true
  tags:
    description: Comma-seperated list of image tags
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUILDAH_ISOLATION: chroot
        BUILDAH_LAYERS: "true"
        STORAGE_DRIVER: vfs
        IMAGE_NAME: ${{ inputs.registry }}/${{ inputs.repository }}
        TAGS: ${{ inputs.tags }}
      run: |
        for TAG in ${TAGS//,/ };
        do
          echo "Pushing ${IMAGE_NAME} ${IMAGE_NAME}:${TAG}"
          buildah push ${IMAGE_NAME} ${IMAGE_NAME}:${TAG};
        done

name: Test
description: Run tests

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        apt update -y -qq && apt install -y -qq cargo
        cargo install --git https://github.com/astral-sh/uv uv
    - shell: bash
      run: uv tool run ruff check
    - shell: bash
      run: uv run pytest


name: Test
description: Run tests

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        apt update -y && apt install -y python3 python3-pip python3-venv
        python3 -m venv /opt/venv
        echo "PATH=/opt/venv/bin:$PATH" >> $GITHUB_ENV
    - shell: bash
      run: |
        python3 -m pip install -q -r requirements-test.txt -r requirements.txt
    - shell: bash
      run: black --check --diff .
    - shell: bash
      run: flake8
    - shell: bash
      run: pytest

name: Test

runs:
  using: composite
  steps:
    - run: |
        apt update -y && apt install -y python3 python3-pip python3-venv
        python3 -m venv /opt/venv
        echo "PATH=/opt/venv/bin:$PATH" >> $GITHUB_ENV
    - run: |
        python3 -m pip install -q -r requirements-test.txt -r requirements.txt
    - run: black --check --diff .
    - run: flake8
    - run: pytest

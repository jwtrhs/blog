name: Build and push
description: Build and push a container image

inputs:
  registry:
    description: Registry
    required: true
  repository:
    description: Repository
    required: true
  tags:
    description: Comma-seperated list of image tags
    required: true
  container_file:
    description: Container file
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        STORAGE_DRIVER: vfs
        BUILDAH_ISOLATION: chroot
      run: |
        buildah build \
          --layers \
          --cache-from ${{ inputs.registry }}/${{ inputs.repository }}-cache \
          --cache-to ${{ inputs.registry }}/${{ inputs.repository }}-cache \
          -t ${{ inputs.registry }}/${{ inputs.repository }} \
          -f ${{ inputs.container_file }} \
          .
        TAGS=${{ inputs.tags }}
        for tag in ${TAGS//,/ };
        do
          buildah push ${{ inputs.registry }}/${{ inputs.repository }} ${{ inputs.registry }}/${{ inputs.repository }}:$tag;
        done

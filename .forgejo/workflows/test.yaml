on: [push]
jobs:
  test:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/library/node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: |
          apt update -y && apt install -y python3 python3-venv
          python3 -m venv .venv
          . .venv/bin/activate
          python3 -m pip install -q -r requirements-test.txt -r requirements.txt
          black --check --diff .
          flake8
          pytest

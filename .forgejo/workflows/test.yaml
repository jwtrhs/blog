on: [push]
jobs:
  test:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/library/node:20-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: |
          apt update -y && apt install -y python3 python3-pip python3-venv
          python3 -m venv .venv
          echo "PATH=$VIRTUAL_ENV/bin:$PATH" >> $GITHUB_ENV
      - run: |
          python3 -m pip install -q -r requirements-test.txt -r requirements.txt
      - run: black --check --diff .
      - run: flake8
      - run: pytest

name: Merge

on:
  push:
    branches:
      - master

jobs:
  build-test-push-deploy:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/wtrhs/ci-cd
      volumes:
        - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/build
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          container_file: deploy/Containerfile
      - uses: ./.forgejo/actions/test
        with:
          image: registry.home.wtrhs.com/wtrhs/blog
      - uses: ./.forgejo/actions/push
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          tags: ${{ github.sha }},latest
      - run: |
          # Setup cluster and CI/CD service account
          kubectl config set-cluster ci-cluster \
            --server=https://kubernetes.default.svc.cluster.local \
            --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          kubectl config set-context ci-context --cluster=ci-cluster
          kubectl config set-credentials ci-user --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
          kubectl config set-context ci-context --user=ci-user
          kubectl config use-context ci-context

          # Modify the image tag
          (
            cd deploy/k8s;
            kustomize edit set image ${IMAGE_NAME}:${IMAGE_TAG};
            kubectl apply -k .
          )

          # Commit the modified files back to the repository
          git add .
          git commit -m "[skip ci] Setting image ${IMAGE_NAME} tag to ${IMAGE_TAG}"
          git push

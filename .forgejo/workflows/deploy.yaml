  build:
    runs-on: docker
    container:
      image: quay.io/buildah/stable
      options: --device /dev/fuse:rw --security-opt label=disable --security-opt seccomp=unconfined --privileged
    steps:
      - run: dnf -q -y install fuse git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/build
        env:
          BUILDAH_ISOLATION: chroot
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          tag: ${{ github.sha }}
          container_file: deploy/Containerfile


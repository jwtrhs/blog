on:
  push:
    branches:
      - master

jobs:
  # test:
  #   runs-on: docker
  #   container:
  #     image: registry.home.wtrhs.com/library/node:20-bookworm
  #   steps:
  #     - uses: https://code.forgejo.org/actions/checkout@v4
  #     - uses: ./.forgejo/actions/test
  build:
    runs-on: docker
    container:
      image: quay.io/buildah/stable
    steps:
      - run: dnf -q -y install git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/build
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          tags: ${{ github.sha }},latest
          container_file: deploy/Containerfile

  deploy:
    needs: [build]
    runs-on: docker
    container:
      image: alpine:latest
      volumes:
        # - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount:ro
        - /kubectl-proxy-socket:/kubectl-proxy-socket
    steps:
      - run: apk add curl envsubst git nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - env:
          NAMESPACE: personal
          DEPLOYMENT_NAME: blog
          CONTAINER_NAME: blog
          IMAGE_NAME: registry.home.wtrhs.com/wtrhs/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Explore the API with TOKEN
          curl \
            --unix-socket /kubectl-proxy-socket/proxy.sock \
            -XGET \
            http://localhost/apis/apps/v1/namespaces/personal/deploments/blog/
            
          PATCH='
          {
            "spec": {
              "template": {
                "spec": {
                  "$setElementOrder/containers": [
                    {
                      "name": "${DEPLOYMENT_NAME}"
                    }
                  ],
                  "containers": [
                    {
                      "image": "${IMAGE_NAME}:${IMAGE_TAG}",
                      "name": "${CONTAINER_NAME}"
                    }
                  ]
                }
              }
            }
          }
          '

          curl \
            --unix-socket /kubectl-proxy-socket/proxy.sock \
            -XPATCH \
            -d "$(echo $PATCH | envsubst)" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            "http://localhost/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOYMENT_NAME}/"  

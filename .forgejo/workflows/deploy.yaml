name: Merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push-deploy:
    runs-on: home-server
    container:
      image: registry.home.wtrhs.com/wtrhs/ci-cd
      volumes:
        - /var/run/secrets/kubernetes.io/serviceaccount:/var/run/secrets/kubernetes.io/serviceaccount
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/build
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          container_file: Containerfile
      - uses: ./.forgejo/actions/test
        with:
          image: registry.home.wtrhs.com/wtrhs/blog
      - uses: ./.forgejo/actions/push
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          tags: ${{ github.sha }},latest
      - env:
          IMAGE_NAME: registry.home.wtrhs.com/wtrhs/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Clone the infra repository
          git clone ssh://git@codeberg.org/jwtrhs/infra.git

          # Modify the image tag
          (
            cd infra/k8s/blog/;
            kustomize edit set image ${IMAGE_NAME}:${IMAGE_TAG};
          )

          # Commit the modified files back to the repository
          git config --global user.email "ci-cd@wtrhs.com"
          git config --global user.name "ci-cd-bot"
          git add .
          git commit -m "[skip ci] Setting image ${IMAGE_NAME} tag to ${IMAGE_TAG}"
          git push

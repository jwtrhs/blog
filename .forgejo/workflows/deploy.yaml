on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/wtrhs/ci
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: ./.forgejo/actions/build
        with:
          registry: registry.home.wtrhs.com
          repository: wtrhs/blog
          tags: ${{ github.sha }},latest
          container_file: deploy/Containerfile

  test:
    needs: [build]
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/wtrhs/ci
    steps:
      - run: podman run registry.home.wtrhs.com/wtrhs/blog:${{ github.sha }} uv tool run ruff check
      - run: podman run registry.home.wtrhs.com/wtrhs/blog:${{ github.sha }} uv run pytest

  deploy:
    needs: [build, test]
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/wtrhs/ci
      volumes:
        # Access to the kubectl proxy socket
        - /kubectl-proxy-socket:/kubectl-proxy-socket
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - env:
          NAMESPACE: personal
          DEPLOYMENT_NAME: blog
          CONTAINER_NAME: blog
          IMAGE_NAME: registry.home.wtrhs.com/wtrhs/blog
          IMAGE_TAG: ${{ github.sha }}
        run: |
          PATCH_PAYLOAD='
          {
            "spec": {
              "template": {
                "spec": {
                  "$setElementOrder/containers": [
                    {
                      "name": "${DEPLOYMENT_NAME}"
                    }
                  ],
                  "containers": [
                    {
                      "image": "${IMAGE_NAME}:${IMAGE_TAG}",
                      "name": "${CONTAINER_NAME}"
                    }
                  ]
                }
              }
            }
          }
          '

          curl \
            --unix-socket /kubectl-proxy-socket/proxy.sock \
            --fail \
            -XPATCH \
            -d "$(echo $PATCH_PAYLOAD | envsubst)" \
            -H "Content-Type: application/strategic-merge-patch+json" \
            "http://localhost/apis/apps/v1/namespaces/${NAMESPACE}/deployments/${DEPLOYMENT_NAME}/"

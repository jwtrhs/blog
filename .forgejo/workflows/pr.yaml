name: Pull request

on:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/wtrhs/ci
    env:
      GIT_SSH_PRIVATE_KEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo ${GIT_SSH_PRIVATE_KEY} > ~/.ssh/id_ed25519
          ls -lah ~/.ssh
          git clone git@codeberg.org:jwtrhs/home-server.git .
          ls -lah .

on:
  workflow_call:
    inputs:
      registry:
        description: Registry
        required: true
      repository:
        description: Repository
        required: true
      tag:
        description: Image
        required: true
      container_file:
        description: Container file
        required: true

env:
  REGISTRY: registry.home.wtrhs.com
  REPOSITORY: wtrhs/blog
  IMAGE_TAG: ${{ github.sha }}
  CONTAINER_FILE: deploy/Containerfile

jobs:
  build:
    runs-on: docker
    container:
      image: registry.home.wtrhs.com/library/node:20-bookworm
      options: --device /dev/fuse --security-opt label=disable --security-opt seccomp=unconfined --privileged
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - env:
          BUILDAH_ISOLATION: chroot
        run: |
          apt update -y && apt install -y buildah
          buildah build \
            --layers \
            --cache-from ${{ inputs.registry }}/${{ inputs.repository }}-cache \
            --cache-to ${{ inputs.registry }}/${{ inputs.repository }}-cache \
            -t ${{ inputs.registry }}/${{ inputs.repository }}:${{ inputs.tag }} \
            -f ${{ inputs.container_file }} \
            .
          buildah push ${{ inputs.registry }}/${{ inputs.repository }}:${{ inputs.tag }}

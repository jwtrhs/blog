apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wtrhs-com
  namespace: personal
spec:
  secretName: wtrhs-com-tls
  dnsNames:
    - wtrhs.com
    - www.wtrhs.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: personal
  labels:
    app: blog
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: blog
          image: registry.home.wtrhs.com/wtrhs/blog
          imagePullPolicy: Always
          env:
            - name: BLOG_APP_TLS_CRT_FILE
              value: "/certs/tls.crt"
            - name: BLOG_APP_TLS_KEY_FILE
              value: "/certs/tls.key"
          volumeMounts:
            - name: certs-vol
              mountPath: "/certs"
              readOnly: true
          ports:
            - containerPort: 8888
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              scheme: HTTPS
              port: 8888
          resources:
            limits:
              cpu: 500m
              memory: 256M
      volumes:
        - name: certs-vol
          secret:
            secretName: wtrhs-com-tls
---
apiVersion: v1
kind: Service
metadata:
  name: blog
  namespace: personal
spec:
  selector:
    app: blog
  ports:
    - name: blog
      port: 8888
      targetPort: 8888

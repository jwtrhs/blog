apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: blog
spec:
  gatewayClassName: internet
  listeners:
    - name: http
      hostname: wtrhs.com
      protocol: HTTP
      port: 80
    - name: http-www
      hostname: www.wtrhs.com
      protocol: HTTP
      port: 80
    - name: http-jon
      hostname: jon.wtrhs.com
      protocol: HTTP
      port: 80
    - name: https
      hostname: wtrhs.com
      port: 443
      protocol: TLS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wtrhs-com-tls
    - name: https-www
      hostname: www.wtrhs.com
      port: 443
      protocol: TLS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wtrhs-com-tls
    - name: https-jon
      hostname: jon.wtrhs.com
      port: 443
      protocol: TLS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wtrhs-com-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog-redirect
spec:
  parentRefs:
    - name: blog
      sectionName: http
    - name: blog
      sectionName: http-www
    - name: blog
      sectionName: http-jon
    - name: blog
      sectionName: https
    - name: blog
      sectionName: https-www
  hostnames:
    - wtrhs.com
    - www.wtrhs.com
    - jon.wtrhs.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
            hostname: jon.wtrhs.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blog
spec:
  hostnames:
    - jon.wtrhs.com
  parentRefs:
    - name: blog
      sectionName: https-jon
  rules:
    - backendRefs:
        - name: blog
          kind: Service
          port: 8888

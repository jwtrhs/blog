image: alpine/edge
packages:
  - docker
  - python3
  - python3-dev
environment:
  REGISTRY: registry.wtrhs.com
  REPOSITORY: wtrhs/blog
  IMAGE_TAG: latest
secrets:
  - 7e862d5d-3db2-4850-92c4-028876f0b8f0
  - eeb6aa0a-89d5-4bfe-89f2-d6da42e74841
tasks:
  - test: |
      cd blog/
      python3 -m venv .venv
      . .venv/bin/activate
      python3 -m pip install -q -r requirements-test.txt -r requirements.txt
      black --check --diff .
      flake8
      pytest
  - end-build-if-not-master: | 
      cd blog/
      if [ "$(git rev-parse master)" != "$(git rev-parse HEAD)" ]; then \
          complete-build; \
      fi
  - setup-docker: |
      sudo addgroup $(whoami) docker
      sudo service docker start
      sleep 5
  - build: |
      cd blog/
      docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -f deploy/Containerfile .
  - deploy: |
      cat ~/.container-registry-password | docker login -u=registry --password-stdin $REGISTRY
      docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
      ssh -o StrictHostKeyChecking=no -p 48989 jon@wtrhs.com "kubectl -n personal rollout restart deployment blog"

# Build script for SourceHut
image: alpine/edge
packages:
  - python3
  - python3-dev
  - py3-pip
  - libffi-dev
  - openssl-dev
secrets:
  - 1e0e32fa-5549-447e-9dae-0baab762e74b
tasks:
  - setup: |
      cd blog/
      python3 -m venv .venv
      . .venv/bin/activate
      python3 -m pip install flake8
  - test: |
      cd blog/ && . .venv/bin/activate
      python3 -m pip install flake8
      flake8
  - end-build-if-master: | 
      cd blog/
      if [ "$(git rev-parse master)" != "$(git rev-parse HEAD)" ]; then \
          complete-build; \
      fi
  - build: |
      cd blog/ && . .venv/bin/activate
      python3 -m pip install --upgrade build
      python3 -m build
  - deploy: |
      cd blog/
      scp -oStrictHostKeyChecking=no -i ~/.ssh/1e0e32fa-5549-447e-9dae-0baab762e74b -P 49898 dist/blog-0.0.0.tar.gz www@wtrhs.com:/srv/www
      ssh -oStrictHostKeyChecking=no -i ~/.ssh/1e0e32fa-5549-447e-9dae-0baab762e74b -p 49898 www@wtrhs.com 'bash -s' < deploy/deploy.sh

# Build script for SourceHut
image: alpine/edge
packages:
  - python3
  - python3-dev
  - py3-pip
  - libffi-dev
  - openssl-dev
secrets:
  - 1e0e32fa-5549-447e-9dae-0baab762e74b
tasks:
  - setup: |
      cd blog
      curl -sSL https://raw.githubusercontent.com/python-poetry/poetry/master/get-poetry.py | python3 -
      source $HOME/.poetry/env
      poetry install --no-interaction --no-ansi
  - test: |
      cd blog
      source $HOME/.poetry/env
      poetry run flake8
  - end-build-if-master: | 
      cd blog
      if [ "$(git rev-parse master)" != "$(git rev-parse HEAD)" ]; then \
          complete-build; \
      fi
  - deploy: |
      tar --exclude='blog/.git' -cvf blog.tar blog/
      scp -oStrictHostKeyChecking=no -i ~/.ssh/1e0e32fa-5549-447e-9dae-0baab762e74b blog.tar www@wtrhs.com:/srv/www
      ssh -oStrictHostKeyChecking=no -i ~/.ssh/1e0e32fa-5549-447e-9dae-0baab762e74b www@wtrhs.com 'bash -s' < blog/deploy/deploy.sh

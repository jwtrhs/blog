name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # The suite is pure Python (ruff/ty/pytest via uv) and does not need the
    # cluster or the registry, so it runs on a hosted runner — same split as
    # jwtrhs/flow: hosted tests, in-cluster image build/push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run ty check
      - name: Test
        run: uv run pytest

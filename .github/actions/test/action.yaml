name: Test
description: Run tests

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11' 
    - shell: bash
      run: |
        python -m venv .venv
        echo "PATH=.venv/bin:$PATH" >> $GITHUB_ENV
    - shell: bash
      run: |
        python -m pip install -q -r requirements-test.txt -r requirements.txt
    - shell: bash
      run: black --check --diff .
    - shell: bash
      run: flake8
    - shell: bash
      run: pytest
